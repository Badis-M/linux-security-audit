name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:13-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends bash bats ca-certificates git iproute2 make python3 shellcheck

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate
        run: make ci
